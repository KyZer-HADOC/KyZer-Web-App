<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KyZer_HADOC</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,#1c0808,#000 70%);color:#fff;
    font-family:system-ui,sans-serif;text-align:center;padding:24px}
  .logo{width:110px;height:110px;object-fit:contain;margin-bottom:22px;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px #ff2d2d66)}50%{transform:scale(1.07);filter:drop-shadow(0 0 22px #ff2d2dcc)}}
  h1{font-size:1.4rem;letter-spacing:2px;margin-bottom:10px}
  .bar{width:160px;height:3px;background:#ffffff18;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#ff2d2d;border-radius:3px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
  #off{display:none}
  #off p{color:#aaa;margin:6px 0 24px;font-size:.95rem}
  button{background:#ff2d2d;color:#fff;border:0;border-radius:999px;padding:14px 38px;font-size:1rem;font-weight:600;box-shadow:0 0 24px #ff2d2d88}
</style>
</head>
<body>
  <img class="logo" src="https://kyzerhadoc.netlify.app/images/logo22.png" onerror="this.style.display='none'" alt="">
  <h1>KyZer_HADOC</h1>
  <div id="load"><div class="bar"><i></i></div></div>
  <div id="off">
    <p>Can't reach the server. Check your internet and try again.</p>
    <button onclick="start()">Retry</button>
  </div>
<script>
  var SITE = 'https://kyzerhadoc.netlify.app';
  function start(){
    document.getElementById('off').style.display = 'none';
    document.getElementById('load').style.display = 'block';
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, 8000);
    fetch(SITE + '/?_=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
      .then(function(){ clearTimeout(t); location.replace(SITE); })
      .catch(function(){
        clearTimeout(t);
        document.getElementById('load').style.display = 'none';
        document.getElementById('off').style.display = 'block';
      });
  }
  window.addEventListener('online', start);
  start();
</script>
</body>
</html>
