<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KyZer_HADOC</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#1a0a0a,#000 70%);color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  .ring{width:90px;height:90px;border-radius:50%;border:4px solid #ff2d2d33;border-top-color:#ff2d2d;animation:spin 1.2s linear infinite;margin-bottom:28px}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:1.5rem;margin-bottom:8px;letter-spacing:1px}
  p{color:#aaa;margin-bottom:28px;font-size:.95rem}
  button{background:#ff2d2d;color:#fff;border:0;border-radius:999px;padding:14px 36px;font-size:1rem;font-weight:600;box-shadow:0 0 24px #ff2d2d88}
</style>
</head>
<body>
  <div class="ring"></div>
  <h1>KyZer_HADOC</h1>
  <p>No internet connection. Connect and try again.</p>
  <button onclick="location.href='https://kyzerhadoc.netlify.app'">Retry</button>
  <script>
    window.addEventListener('online', function(){ location.href='https://kyzerhadoc.netlify.app'; });
  </script>
</body>
</html>
